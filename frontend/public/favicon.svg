<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Jarvis AI Core / Arc Reactor Icon -->
  <defs>
    <radialGradient id="jarvisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8d5a2" stop-opacity="1"/>
      <stop offset="60%" stop-color="#4ade80" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#121813" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d5a2"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Outer background circle -->
  <circle cx="32" cy="32" r="30" fill="#121813" stroke="url(#ringGrad)" stroke-width="2"/>
  
  <!-- Outer rotating ticks ring -->
  <circle cx="32" cy="32" r="23" stroke="#a8d5a2" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.8"/>
  
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="16" stroke="#4ade80" stroke-width="2" stroke-dasharray="14 5"/>

  <!-- Core glow and center node -->
  <circle cx="32" cy="32" r="10" fill="url(#jarvisGlow)"/>
  <circle cx="32" cy="32" r="4.5" fill="#eaf7eb"/>
  
  <!-- Radial target crosshairs -->
  <line x1="32" y1="6" x2="32" y2="12" stroke="#a8d5a2" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="58" stroke="#a8d5a2" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="12" y2="32" stroke="#a8d5a2" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="58" y2="32" stroke="#a8d5a2" stroke-width="2" stroke-linecap="round"/>
</svg>
